<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123c2e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>FisioBea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral no tablet, navegação inferior no celular; conteúdo numa coluna calma */
/* Visual "Consultório": verde-floresta, areia e pêssego (mesmo da página de vendas) */
:root {
  --bg: #f7f3ec;
  --surface: #ffffff;
  --fg: #1a2420;
  --muted: #66716a;
  --line: #e4dccf;
  --green: #123c2e;
  --green-2: #1d5a43;
  --green-soft: #dfece4;
  --on-green: #f3efe6;
  --yellow: #e3b23c;
  --yellow-soft: #fbe3d2;
  --rust: #a85a2e;
  --danger: #b4382c;
  --danger-soft: #fbe9e7;
  --blue: #2c6aa0;
  --blue-soft: #e6eff8;
  --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --font: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1713; --surface: #172520; --fg: #ece4d6; --muted: #a0aba4; --line: #2a3a32;
  --green: #8fc9a8; --green-2: #a9d8bd; --green-soft: #1d3329; --on-green: #0e1713; --yellow: #f0c94a; --yellow-soft: #3a281d; --rust: #f2b48c;
  --danger: #ef7d70; --danger-soft: #34201d; --blue: #7fb2e0; --blue-soft: #1a2633; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1713; --surface: #172520; --fg: #ece4d6; --muted: #a0aba4; --line: #2a3a32;
  --green: #8fc9a8; --green-2: #a9d8bd; --green-soft: #1d3329; --on-green: #0e1713; --yellow: #f0c94a; --yellow-soft: #3a281d; --rust: #f2b48c;
  --danger: #ef7d70; --danger-soft: #34201d; --blue: #7fb2e0; --blue-soft: #1a2633; color-scheme: dark }

* { box-sizing: border-box; }
body { margin: 0; padding-top: env(safe-area-inset-top, 0px); }
[hidden] { display: none !important; }
.login { min-height: 100vh; display: grid; grid-template-columns: 1fr; }
.login-foto { display: none; }
.login-main { display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 900px) {
  .login { grid-template-columns: 1fr 1fr; }
  .login-foto { display: block; padding: 24px; }
  .login-foto img { width: 100%; height: 100%; object-fit: cover; object-position: 28% center; border-radius: 999px 999px 24px 24px; background: var(--line); }
}
.login-box { width: min(400px, 100%); display: grid; gap: 14px; }
.login-box .brand { justify-content: center; font-size: 2.2rem; margin-bottom: 6px; }
.login-box .brand svg { width: 40px; height: 40px; }
.login-box h2 { font-size: 1.9rem; }
.erro-form { color: var(--danger); font-size: .9rem; min-height: 1.2em; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }

.shell { display: grid; grid-template-columns: 1fr; min-height: 100%; }
aside.side { background: var(--surface); border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font: 400 1.6rem/1 var(--serif); color: var(--green); }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand i { color: var(--rust); }
nav.tabs { display: flex; gap: 4px; }
nav.tabs button { background: none; border: 0; color: var(--muted); font: 500 .95rem var(--font); padding: 10px 12px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
nav.tabs button svg { width: 21px; height: 21px; flex: none; }
nav.tabs button.on { color: var(--green); background: var(--green-soft); }

.wrap { max-width: 900px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { padding-block: 20px 110px; min-width: 0; }
.mobile-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.mobile-top .wrap { padding-block: 12px; display: flex; justify-content: space-between; align-items: center; }

@media (max-width: 799px) {
  aside.side { display: contents; }
  aside.side .brand { display: none; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); justify-content: space-around; padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
  nav.tabs button { flex-direction: column; gap: 2px; font-size: .7rem; padding: 6px 6px; border-radius: 14px; }
}
@media (min-width: 800px) {
  .shell { grid-template-columns: 220px 1fr; }
  aside.side { position: sticky; top: 0; height: 100vh; padding: 22px 14px; display: flex; flex-direction: column; gap: 26px; }
  aside.side .brand { padding: 0 8px; }
  nav.tabs { flex-direction: column; }
  .mobile-top { display: none; }
  main { padding-block: 28px 60px; }
}

h2 { font: 400 2rem/1.05 var(--serif); margin: 0; color: var(--green); text-wrap: balance; }
h3 { margin: 0; font-size: 1.05rem; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.sub { color: var(--muted); font-size: .9rem; margin: 2px 0 0; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.section { margin-top: 26px; display: grid; gap: 10px; }

button, .btn { font: 600 .92rem var(--font); border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; background: var(--green); color: var(--on-green); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.ghost { background: transparent; color: var(--green); border: 1px solid var(--line); }
.link { background: none; color: var(--green); padding: 6px 4px; }
.danger { background: none; color: var(--danger); padding: 6px 4px; }
.small { padding: 7px 12px; font-size: .85rem; }
.wa { background: #1f9d55; color: #fff; }
button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }

input, select, textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; }
textarea { min-height: 80px; resize: vertical; line-height: 1.45; }
.field { display: grid; gap: 6px; }
.field > span { font-size: .85rem; font-weight: 600; color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .field { flex: 1 1 150px; min-width: 0; }
.search { margin-bottom: 14px; }

/* Cartões de resumo */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 640px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 4px; }
.stat strong { font: 400 2rem/1 var(--serif); color: var(--green); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--yellow); border-radius: 99px; }

/* Listas */
.list { display: grid; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
.item.tap { cursor: pointer; }
.item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.item-top > div { min-width: 0; }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; font-weight: 600; }
.time small { display: block; font-size: .78rem; font-weight: 500; opacity: .8; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--line); color: var(--fg); white-space: nowrap; }
.st-agendado { background: var(--yellow-soft); color: var(--rust); }
.st-confirmado { background: var(--blue-soft); color: var(--blue); }
.st-realizado, .pill.green { background: var(--green-soft); color: var(--green); }
.st-faltou, .pill.red { background: var(--danger-soft); color: var(--danger); }
.st-justificada { background: var(--line); color: var(--muted); }
.st-cancelado { background: var(--line); color: var(--muted); text-decoration: line-through; }
.ex { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: .92rem; }
.ex li { display: flex; justify-content: space-between; gap: 10px; border-top: 1px dashed var(--line); padding-top: 6px; }
.ex li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.empty { text-align: center; padding: 32px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--yellow-soft); color: var(--rust); display: grid; place-items: center; font: 400 1.25rem var(--serif); flex: none; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.lg { width: 56px; height: 56px; font-size: 1.6rem; }
.foto-campo { display: flex; align-items: center; gap: 14px; }
.foto-campo input[type=file] { display: none; }
.tline { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: .95rem; }
.tline:first-child { border-top: 0; }

/* Agenda */
.days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 14px; }
.day { background: none; color: var(--fg); border: 1px solid transparent; padding: 10px 0; border-radius: 18px; display: grid; gap: 2px; justify-items: center; }
.day small { color: var(--muted); font-weight: 500; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; }
.day strong { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.day i { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
.day.has i { background: var(--yellow); }
.day.on { background: var(--green); color: var(--on-green); }
.day.on small { color: inherit; opacity: .8; }
.day.today:not(.on) { border-color: var(--line); }
.weeknav { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.weeknav button { background: none; color: var(--muted); padding: 6px 10px; font-size: 1.1rem; }
/* Agenda: troca entre semana e mês, e a grade do mês */
.vista { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.vista button { background: none; color: var(--muted); border: 0; border-radius: 999px; padding: 6px 13px; font-size: .85rem; font-weight: 600; }
.vista button.on { background: var(--green); color: var(--on-green); }
.mes-sem, .mes-grade { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.mes-sem { margin-bottom: 4px; text-align: center; font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.mcel { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; min-height: 92px; padding: 6px; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 3px; text-align: left; overflow: hidden; font-weight: 400; }
.mcel:hover { border-color: var(--green); }
.mcel.fora { opacity: .4; }
.mnum { align-self: flex-start; font-weight: 600; font-size: .85rem; min-width: 24px; height: 24px; padding: 0 4px; border-radius: 999px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.mcel.today .mnum { background: var(--green); color: var(--on-green); }
.mev { display: grid; gap: 2px; min-width: 0; }
.mev i { font-style: normal; font-size: .72rem; line-height: 1.3; padding: 1px 5px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mev em { font-style: normal; font-size: .7rem; color: var(--muted); padding-left: 5px; }
.mqtd { display: none; }
@media (max-width: 700px) {
  .mcel { min-height: 56px; padding: 5px 2px; align-items: center; border-radius: 12px; gap: 4px; }
  .mnum { align-self: center; }
  .mev { display: none; }
  .mqtd { display: grid; place-items: center; min-width: 20px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--yellow-soft); color: var(--rust); font-size: .7rem; font-weight: 700; }
  .mqtd:empty { visibility: hidden; }
}
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.status-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.status-pick button { background: var(--surface); color: var(--fg); border: 1px solid var(--line); padding: 6px 10px; font-size: .82rem; font-weight: 500; border-radius: 999px; }
.status-pick button.on { border-color: transparent; font-weight: 700; }

/* Abas do paciente */
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; scrollbar-width: none; }
.chip { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; white-space: nowrap; font-weight: 500; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.back { background: none; color: var(--muted); padding: 4px 0; margin-bottom: 8px; font-weight: 500; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 8px 12px; font-size: .95rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* Treinos */
.ex-edit { display: grid; grid-template-columns: 1fr 64px 90px 80px 32px; gap: 6px; align-items: center; }
.ex-edit input { padding: 9px 10px; font-size: .92rem; }
.ex-edit .x { background: none; color: var(--muted); padding: 4px; font-size: 1.1rem; }
.ex-head { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
@media (max-width: 560px) {
  .ex-edit { grid-template-columns: 1fr 1fr 1fr 32px; }
  .ex-edit .nome { grid-column: 1 / -1; }
  .ex-head { display: none; }
  .ex-block { border-top: 1px solid var(--line); padding-top: 8px; }
}
.letter-badge { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--yellow-soft); color: var(--rust); font: 400 1.3rem var(--serif); flex: none; }
.tname { border: 0; padding: 4px 0; font-weight: 600; font-size: 1.05rem; background: none; }

/* Registros clínicos */
.rec dl { margin: 0; display: grid; gap: 10px; }
.rec dt { font-size: .76rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.rec dd { margin: 2px 0 0; white-space: pre-wrap; line-height: 1.5; overflow-wrap: anywhere; }
.vitals { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .9rem; font-variant-numeric: tabular-nums; }
.vitals b { color: var(--muted); font-weight: 600; margin-right: 4px; }
.collapsed dl { display: none; }

/* Modelo */
.mf { display: grid; grid-template-columns: 1fr 130px auto auto auto; gap: 6px; align-items: center; }
.mf button { background: none; color: var(--muted); padding: 6px 8px; }
@media (max-width: 560px) { .mf { grid-template-columns: 1fr auto auto auto; } .mf select { grid-column: 1 / -1; grid-row: 2; } }

/* Documento */
.doc-preview { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; white-space: pre-wrap; line-height: 1.6; font-size: .95rem; }

/* Folha (formulários) */
.sheet-bg { position: fixed; inset: 0; background: rgba(10, 20, 14, .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: min(680px, 100%); max-height: 92%; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
@media (min-width: 800px) { .sheet-bg { align-items: center; } .sheet { border-radius: 20px; } }
.sheet h3 { font-size: 1.2rem; }
.sheet-foot { display: flex; justify-content: space-between; gap: 8px; align-items: center; position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom, 0px)); background: var(--surface); padding-block: 12px; border-top: 1px solid var(--line); }
.sheet-foot .row { margin-left: auto; }
.weekpick { display: flex; gap: 6px; flex-wrap: wrap; }
.weekpick label { display: inline-flex; }
.weekpick input { display: none; }
.weekpick span { border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer; font-weight: 500; font-size: .9rem; }
.weekpick input:checked + span { background: var(--green); border-color: var(--green); color: var(--on-green); }
.switch { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.switch input { width: 20px; height: 20px; accent-color: var(--green); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .9rem; z-index: 30; max-width: calc(100% - 32px); }

/* Indicador do menu: uma pílula que desliza até a aba escolhida */
@media (min-width: 800px) { nav.tabs { position: relative; } } /* no celular ela já é fixa embaixo */
nav.tabs button { position: relative; z-index: 1; }
nav.tabs button.on { background: transparent; }
.tab-ind { position: absolute; left: 0; top: 0; z-index: 0; border-radius: 999px; background: var(--green-soft); pointer-events: none; }
@media (max-width: 799px) { .tab-ind { border-radius: 14px; } }

/* Onda do toque: mostra onde o dedo encostou */
button, .btn, .item.tap { position: relative; }
.onda-caixa { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; pointer-events: none; }
.onda { position: absolute; border-radius: 50%; background: currentColor; opacity: 0; pointer-events: none; }
.chip { flex: none; }

/* Abas do prontuário com pílula deslizante */
.abas-pront { position: relative; width: fit-content; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; align-self: start; }
.abas-pront .chip { position: relative; z-index: 1; background: transparent; border-color: transparent; color: var(--muted); }
.abas-pront .chip.on { background: transparent; border-color: transparent; color: var(--bg); }
.abas-pront .pil { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 999px; background: var(--fg); z-index: 0; pointer-events: none; }
#pront-conteudo { position: relative; }
.pront-velho { position: absolute; inset: 0 0 auto 0; pointer-events: none; }
#adm-conteudo { position: relative; display: grid; gap: 0; }
.abas-adm { margin-bottom: 16px; }
/* Comunicados no topo do app */
.comunicado { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; padding: 14px 16px; border-radius: 16px; margin-bottom: 14px; background: var(--green-soft); color: var(--fg); overflow: hidden; }
.comunicado.aviso { background: var(--yellow-soft); }
.comunicado.promo { background: linear-gradient(120deg, var(--green-soft), var(--yellow-soft)); }
.comunicado .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); font-size: 1.05rem; }
.comunicado b { display: block; margin-bottom: 2px; }
.comunicado p { margin: 0; font-size: .92rem; color: var(--muted); white-space: pre-line; }
.comunicado .x { background: none; color: var(--muted); padding: 2px 6px; font-size: 1.2rem; line-height: 1; }
/* Assinar: cartões de plano e Pix */
.planos { display: grid; gap: 10px; }
.plano-op { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--surface); color: var(--fg); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 16px; font-weight: 400; }
.plano-op .bola { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.plano-op .bola::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--green); transform: scale(0); }
.plano-op.on { border-color: var(--green); background: var(--green-soft); }
.plano-op.on .bola { border-color: var(--green); }
.plano-op.on .bola::after { transform: scale(1); }
.plano-op strong { font: 400 1.35rem/1 var(--serif); color: var(--green); font-variant-numeric: tabular-nums; }
.plano-op small { display: block; color: var(--muted); font-size: .8rem; }
.selo { display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--yellow-soft); color: var(--rust); margin-left: 6px; vertical-align: 2px; }

.cor-faltou { background: var(--danger); } .cor-justificada { background: var(--muted); } .cor-cancelado { background: var(--line); }

/* Troca de tema: a animação do círculo é feita pelo script */

async function api(caminho, opcoes = {}) {

  if (r.status === 402 && caminho !== 'login') { S.usuario = null; mostrarLogin(corpo.erro, corpo); }
  if (!r.ok) { const e = new Error(corpo.erro || 'Erro ' + r.status); e.status = r.status; e.corpo = corpo; throw e; }
  return corpo;
}

const cpfValido = v => {

// Pix copia e cola (padrão BR Code do Banco Central): chave, nome, cidade e valor num texto que o banco entende
function chavePix(c) {
  c = String(c || '').trim();
  if (c.includes('@')) return c.toLowerCase();
  if (c.startsWith('+')) return '+' + soDigitos(c);
  if (/^[\d.\-/ ()]+$/.test(c)) return soDigitos(c); // CPF ou CNPJ
  return c; // chave aleatória
}
function pixCopiaECola({ chave, nome, cidade, valor, txid = '***' }) {
  const campo = (id, v) => id + String(v.length).padStart(2, '0') + v;
  const limpa = (t, n) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9 ]/g, '').toUpperCase().slice(0, n).trim();
  const s0 = campo('00', '01') + campo('26', campo('00', 'br.gov.bcb.pix') + campo('01', chavePix(chave))) + campo('52', '0000') + campo('53', '986')
    + (valor ? campo('54', Number(valor).toFixed(2)) : '') + campo('58', 'BR') + campo('59', limpa(nome, 25) || 'FISIOBEA') + campo('60', limpa(cidade, 15) || 'SAO PAULO')
    + campo('62', campo('05', txid)) + '6304';
  let crc = 0xffff;
  for (const ch of s0) { crc ^= ch.charCodeAt(0) << 8; for (let i = 0; i < 8; i++) { crc = crc & 0x8000 ? (crc << 1) ^ 0x1021 : crc << 1; crc &= 0xffff; } }
  return s0 + crc.toString(16).toUpperCase().padStart(4, '0');
}

// ================= Agenda: sessões =================
// As sessões nascem dos dias fixos do paciente; mudanças (status, horário, remarcação) ficam em "sessoes".
const sessaoId = (pid, data) => pid + '_' + data;
function sessoesDoDia(di) {
  const wd = deIso(di).getDay(), lista = [];
  for (const p of ativos()) {
    if (!(p.dias || []).includes(wd) || (p.inicio && di < p.inicio) || (p.fim && di > p.fim)) continue;
    const id = sessaoId(p.id, di), salvo = S.sessoes.find(s => s.id === id);
    lista.push({ id, pacienteId: p.id, data: di, horario: p.horario || '', horarioFim: p.horarioFim || '', status: 'agendado', ...(salvo || {}) });
  }
  for (const s of S.sessoes) if (s.avulsa && s.data === di && pac(s.pacienteId)) lista.push(s);
  return lista.filter(s => s.status !== 'remarcado').sort((a, b) => (a.horario || '').localeCompare(b.horario || ''));
}
// Horário do atendimento com o término, quando tiver: "08:00–09:00"
const faixa = s => s.horario ? s.horario + (s.horarioFim ? '–' + s.horarioFim : '') : '';
const horaCelula = s => `<span class="time">${esc(s.horario || '--:--')}${s.horarioFim ? `<small>${esc(s.horarioFim)}</small>` : ''}</span>`;
// Ao preencher o início, sugere o término 1 hora depois (até a pessoa mexer no término)
window.sugerirFim = (ini, fim) => {
  const a = $(ini).value, b = $(fim);
  if (!a || (b.value && !b.dataset.auto)) return;
  const [h, m] = a.split(':').map(Number);
  b.value = String((h + 1) % 24).padStart(2, '0') + ':' + String(m).padStart(2, '0'); b.dataset.auto = '1';
};
function sessoesEntre(ini, fim) { const out = []; for (let d = deIso(ini); iso(d) <= fim; d.setDate(d.getDate() + 1)) out.push(...sessoesDoDia(iso(d))); return out; }

// Rodízio A → B → C…: conta só as sessões que aconteceram (faltas e cancelamentos não avançam o treino)
function treinoDoDia(p, di) {
  const lista = p.treinos || [];
  if (!lista.length) return null;
  const salvo = S.sessoes.find(s => s.id === sessaoId(p.id, di) || (s.avulsa && s.pacienteId === p.id && s.data === di));
  if (salvo?.treino) return lista.find(t => t.letra === salvo.treino) || null;
  const inicio = p.inicio || di;
  if (di < inicio) return null;
  let n = 0;
  for (let d = deIso(inicio); iso(d) < di; d.setDate(d.getDate() + 1)) {
    const k = iso(d);
    if (!(p.dias || []).includes(d.getDay())) continue;
    const s = S.sessoes.find(x => x.id === sessaoId(p.id, k));
    if (s && NAO_CONTA.includes(s.status)) continue;
    n++;
  }
  return lista[n % lista.length];
}
const prescricao = x => [x.series && x.series + 'x', x.reps, x.carga].filter(Boolean).join(' · ');
function mudarStatus(sess, status) {
  const { id, pacienteId, data, horario, horarioFim, avulsa, treino, obs } = sess;
  return salvar(() => store.put('sessoes', { id, pacienteId, data, horario, horarioFim: horarioFim || '', avulsa: !!avulsa, treino: treino || '', obs: obs || '', status }), STATUS[status]);
}
window.statusSessao = (id, data, status) => { const s = sessoesDoDia(data).find(x => x.id === id); if (s) mudarStatus(s, status); fechar(); };

// Anel do pacote: a parte cheia são as sessões já usadas
function anelPacote(sp) {
  const c = +(2 * Math.PI * 24).toFixed(2), uso = Math.min(1, Math.max(0, sp.usadas / (sp.compradas || 1)));
  const cls = sp.saldo <= 0 ? 'fim' : sp.saldo <= 2 ? 'pouco' : '';
  return `<span class="anel" aria-hidden="true"><svg viewBox="0 0 58 58"><circle class="f" cx="29" cy="29" r="24"/><circle class="v ${cls}" cx="29" cy="29" r="24" style="--c:${c};stroke-dasharray:${c};stroke-dashoffset:${(c * (1 - uso)).toFixed(2)}"/></svg></span>`;
}
// Pacotes: saldo = sessões compradas − sessões realizadas desde a compra
function saldoPacote(p) {
  const pacotes = S.pagamentos.filter(g => g.pacienteId === p.id && g.tipo === 'pacote' && g.status === 'pago').sort((a, b) => a.data.localeCompare(b.data));
  if (!pacotes.length) return null;
  const desde = pacotes[0].data;
  const compradas = pacotes.reduce((s, g) => s + (Number(g.qtd) || 0), 0);
  const usadas = sessoesEntre(desde, hojeIso()).filter(s => s.pacienteId === p.id && s.status === 'realizado').length;
  return { compradas, usadas, saldo: compradas - usadas };
}

window.mudarMes = n => { const [a, m] = S.agMes.split('-').map(Number); S.agMes = iso(new Date(a, m - 1 + n, 1)).slice(0, 7); render(); };
window.abrirDia = di => { S.agVista = 'semana'; S.dia = di; S.semana = semanaDe(di); render(); window.scrollTo(0, 0); };
function vMes() {

}
function vAgenda() {
  if (S.agVista === 'mes') return vMes();
  const dias = semanaDias(), hoje = hojeIso();
  if (!S.dia || !dias.some(d => iso(d) === S.dia)) S.dia = iso(dias.find(d => iso(d) === hoje) || dias[0]);

function cartaoSessao(s) {

window.escolherStatus = (id, data) => {
  const s = sessoesDoDia(data).find(x => x.id === id), p = pac(s.pacienteId);
  const ancora = [...document.querySelectorAll('.pill[data-sid]')].find(b => b.dataset.sid === id);
  if (!ancora) return sheet(`<h3>${esc(nome(p))} · ${br(data)} ${esc(faixa(s))}</h3><div class="label">Status do atendimento</div>
    <div class="status-pick">${Object.entries(STATUS).map(([k, v]) => `<button type="button" class="${s.status === k ? 'on st-' + k : ''}" onclick="statusSessao('${id}','${data}','${k}')">${v}</button>`).join('')}</div>`, null);
  fecharPop();
  const pop = document.createElement('div');
  pop.className = 'pop'; pop.id = 'pop-status'; pop.setAttribute('role', 'menu');
  pop.innerHTML = Object.entries(STATUS).map(([k, v]) => `<button type="button" role="menuitem" class="${s.status === k ? 'on' : ''}" data-k="${k}"><i class="cor-${k}"></i>${v}</button>`).join('')
    + '<p class="sub">Faltas e cancelamentos não avançam o rodízio de treinos.</p>';
  document.body.appendChild(pop);
  // Abre embaixo do botão; se não couber, abre em cima. A origem da animação é o próprio botão
  const r = ancora.getBoundingClientRect(), ph = pop.offsetHeight, pw = pop.offsetWidth;
  const embaixo = r.bottom + 8 + ph < innerHeight - 70;
  const top = embaixo ? r.bottom + 8 : Math.max(8, r.top - 8 - ph), left = Math.min(Math.max(8, r.right - pw), innerWidth - pw - 8);
  pop.style.top = top + 'px'; pop.style.left = left + 'px';
  pop.style.setProperty('--origem', `${r.left + r.width / 2 - left}px ${embaixo ? '0px' : ph + 'px'}`);
  pop.onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    fecharPop();
    if (b.dataset.k === s.status) return;
    realceStatus = id;
    mudarStatus(s, b.dataset.k);
  };
  pop.querySelector('button.on, button')?.focus({ preventScroll: true });
  setTimeout(() => { addEventListener('pointerdown', foraDoPop, true); addEventListener('scroll', fecharPop, { passive: true, once: true }); addEventListener('keydown', escPop); }, 0);
};
function foraDoPop(e) { if (!e.target.closest('#pop-status')) fecharPop(); }
function escPop(e) { if (e.key === 'Escape') fecharPop(); }
function fecharPop() {
  removeEventListener('pointerdown', foraDoPop, true); removeEventListener('keydown', escPop);
  const p = $('#pop-status'); if (!p) return;
  p.id = '';
  if (semAnim()) return p.remove();
  p.classList.add('fecha'); setTimeout(() => p.remove(), 230);
}

// Reduz a foto para 240 px (JPEG) antes de guardar: fica leve para celulares simples e cabe no registro
window.escolherFoto = input => {
  const arq = input.files && input.files[0];
  if (!arq) return;
  const img = new Image(), url = URL.createObjectURL(arq);
  img.onload = () => {
    const lado = 240, c = document.createElement('canvas'), m = Math.min(img.width, img.height);
    c.width = c.height = lado;
    c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, lado, lado);
    const dado = c.toDataURL('image/jpeg', .82);
    URL.revokeObjectURL(url);
    $('#f-foto').value = dado;
    $('#f-foto-prev').innerHTML = `<img src="${dado}" alt="">`;
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Não foi possível abrir essa imagem'); };
  img.src = url;
};

    <div style="min-width:0"><h2>${esc(nome(p))}</h2><p class="sub">${[p.diagnostico, textoIdade(p.nascimento), p.ativo === false && 'Inativo'].filter(Boolean).map(esc).join(' · ')}</p></div></div>
    ${p.celular ? `<a class="btn wa small" target="_blank" rel="noopener" href="${waLink(p.celular, '')}">WhatsApp</a>` : ''}
  </div>
  <div class="chips abas-pront" id="abas-pront" role="tablist"><span class="pil" aria-hidden="true"></span>${SUBS.map(([k, n]) => `<button class="chip ${S.sub === k ? 'on' : ''}" role="tab" aria-selected="${S.sub === k}" data-sub="${k}" data-k="${k}" onclick="trocarSub('${k}')">${n}</button>`).join('')}</div>
  <div id="pront-conteudo">${corpo}</div>`;
}
function pResumo(p) {
  const proximas = []; for (let i = 0, d = new Date(); i < 30 && proximas.length < 4; i++, d.setDate(d.getDate() + 1)) proximas.push(...sessoesDoDia(iso(d)).filter(s => s.pacienteId === p.id && !['cancelado'].includes(s.status)));
  const hist = sessoesEntre(p.inicio || hojeIso(), hojeIso()).filter(s => s.pacienteId === p.id);
  const sp = saldoPacote(p);
  const ultAval = S.avaliacoes.filter(a => a.pacienteId === p.id).sort((a, b) => b.data.localeCompare(a.data))[0];
  const objetivo = ultAval?.campos?.find(c => /objetivo/i.test(c.rotulo))?.valor;
  const linha = (k, v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : '';
  return `
  <div class="stats">
    <div class="stat"><span class="label">Sessões feitas</span><strong>${hist.filter(s => s.status === 'realizado').length}</strong></div>
    <div class="stat"><span class="label">Faltas</span><strong>${hist.filter(s => s.status === 'faltou').length}</strong></div>
    <div class="stat"><span class="label">Evoluções</span><strong>${S.evolucoes.filter(e => e.pacienteId === p.id).length}</strong></div>
    <div class="stat"><span class="label">Pacote</span>${sp ? `<div class="stat-anel">${anelPacote(sp)}<div><strong>${sp.saldo}</strong><span class="muted" style="display:block;font-size:.8rem">restam de ${sp.compradas}</span></div></div>` : '<strong>—</strong><span class="muted" style="font-size:.8rem">sem pacote</span>'}</div>
  </div>
  ${objetivo ? `<div class="section"><h3>Objetivos do tratamento</h3><div class="item" style="white-space:pre-wrap">${esc(objetivo)}</div></div>` : ''}
  <div class="section"><h3>Próximos atendimentos</h3>
    ${proximas.length ? `<div class="item">${proximas.slice(0, 4).map(s => `<div class="tline"><span class="num">${DIAS[deIso(s.data).getDay()]} ${br(s.data).slice(0, 5)} · ${esc(faixa(s))}</span><span class="pill st-${s.status}">${STATUS[s.status]}</span></div>`).join('')}</div>` : '<div class="empty">Sem atendimentos nos próximos 30 dias.</div>'}
  </div>
  <div class="section"><div class="row" style="justify-content:space-between"><h3>Dados cadastrais</h3><button class="link small" onclick="editarPaciente('${p.id}')">Editar</button></div>
    <div class="item"><dl class="kv">
      ${linha('Nascimento', p.nascimento && `${br(p.nascimento)} (${textoIdade(p.nascimento)})`)}${linha('CPF', p.cpf)}${linha('Celular', p.celular)}${linha('E-mail', p.email)}
      ${linha('Endereço', p.endereco)}${linha('Responsável', p.responsavel)}${linha('Convênio', p.convenio)}${linha('Valor da sessão', p.valorSessao && reais(String(p.valorSessao).replace(',', '.')))}
      ${linha('Encaminhamento', p.medico)}${linha('Dias', (p.dias || []).map(d => DIAS_LONGO[d]).join(', ') + (p.horario ? (p.horarioFim ? `, das ${p.horario} às ${p.horarioFim}` : ' às ' + p.horario) : ''))}${linha('Início', br(p.inicio))}${linha('Observações', p.obs)}
    </dl></div>
    <div>${p.ativo === false
      ? `<button class="ghost small" onclick="alternarAtivo('${p.id}')">Reativar paciente</button>`
      : `<button class="ghost small" onclick="confirmar('Dar alta e inativar este paciente?', () => alternarAtivo('${p.id}'), 'Inativar')">Dar alta / inativar</button>`}</div>
  </div>`;
}

// ---------- Avaliações ----------
function cartaoRegistro(r, tipo) {
  const campos = (r.campos || []).filter(c => c.valor);
  const vit = campos.filter(c => c.tipo === 'linha');
  const resto = campos.filter(c => c.tipo !== 'linha');
  return `<div class="item rec" data-reg="${tipo}:${esc(r.id)}">
    <div class="item-top"><div class="row" style="gap:8px"><strong class="num">${br(r.data)}</strong>${r.titulo ? `<span class="pill green">${esc(r.titulo)}</span>` : ''}${r.treino ? `<span class="pill green">Treino ${esc(r.treino)}</span>` : ''}</div>
      <div class="row" style="gap:2px"><button class="link small" onclick="copiarRegistro('${tipo}','${r.id}')">Copiar</button><button class="link small" onclick="${tipo === 'evolucoes' ? 'abrirEvolucao' : 'abrirAvaliacao'}('${r.id}')">Editar</button></div></div>
    ${vit.length ? `<div class="vitals">${vit.map(c => `<span><b>${esc(c.rotulo.replace(/\s*\(.*\)/, ''))}</b>${esc(c.valor)}</span>`).join('')}</div>` : ''}
    <dl>${resto.map(c => `<div><dt>${esc(c.rotulo)}</dt><dd>${esc(c.valor)}</dd></div>`).join('')}</dl>
  </div>`;
}
window.copiarRegistro = (col, id) => {
  const r = S[col].find(x => x.id === id), p = pac(r.pacienteId);
  copiarTexto(`${p.nome} · ${br(r.data)}${r.titulo ? ' · ' + r.titulo : ''}${r.treino ? ' · Treino ' + r.treino : ''}\n\n` + r.campos.filter(c => c.valor).map(c => `${c.rotulo}: ${c.valor}`).join('\n'), 'Texto copiado');
};
function pAvaliacoes(p) {
  const lista = S.avaliacoes.filter(a => a.pacienteId === p.id).sort((a, b) => b.data.localeCompare(a.data));
  return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="muted">${lista.length} avaliação(ões)</span><button class="small" onclick="novaAvaliacao('${p.id}')">Nova avaliação</button></div>
  <div class="list">${lista.map(a => cartaoRegistro(a, 'avaliacoes')).join('') || '<div class="empty">Nenhuma avaliação. Escolha uma ficha: inicial, ortopédica, neurológica, respiratória, geriátrica, pélvica ou dor.</div>'}</div>`;
}
window.novaAvaliacao = pid => {
  sheet(`<h3>Qual ficha de avaliação?</h3><div class="list">${Object.entries(AVALIACOES).map(([k, a]) => `
    <button type="button" class="ghost" style="justify-content:space-between" onclick="formAvaliacao({pacienteId:'${pid}',data:hojeIso(),tipo:'${k}',titulo:'${a.nome}',campos:AVALIACOES['${k}'].campos.map(c=>({rotulo:c.replace(/^_/,''),tipo:c[0]==='_'?'linha':'texto',valor:''}))})">${a.nome}<span class="muted" style="font-weight:400">${a.campos.length} campos</span></button>`).join('')}</div>`, null);
};
function formRegistro(r, titulo, onSave, extraTopo = '', excluir = '') {
  sheet(`<h3>${titulo} · ${esc(nome(pac(r.pacienteId)))}</h3>
    <div class="row"><label class="field"><span>Data</span><input id="r-data" type="date" name="data" required value="${r.data}"></label>${extraTopo}</div>
    <div class="row">${r.campos.map((c, i) => c.tipo === 'linha' ? `<label class="field" style="flex:1 1 130px"><span>${esc(c.rotulo)}</span><input id="r${i}" name="c${i}" value="${esc(c.valor)}"></label>` : '').join('')}</div>
    ${r.campos.map((c, i) => c.tipo !== 'linha' ? `<label class="field"><span>${esc(c.rotulo)}</span><textarea id="r${i}" name="c${i}">${esc(c.valor)}</textarea></label>` : '').join('')}`,
    f => { r.data = f.get('data'); if (f.has('treino')) r.treino = f.get('treino'); r.campos = r.campos.map((c, i) => ({ ...c, valor: f.get('c' + i) || '' })); onSave(r); }, excluir);
}
window.formAvaliacao = a => formRegistro(a, a.titulo, x => salvar(() => store.put('avaliacoes', { ...x, id: x.id || uid() }), 'Avaliação salva'), '',
  a.id ? `<button type="button" class="danger" onclick="excluirComDesfazer('avaliacoes','${a.id}','Avaliação excluída')">Excluir</button>` : '');
window.abrirAvaliacao = id => formAvaliacao(JSON.parse(JSON.stringify(S.avaliacoes.find(x => x.id === id))));

// ---------- Evoluções ----------
function pEvolucoes(p) {
  const lista = S.evolucoes.filter(e => e.pacienteId === p.id).sort((a, b) => b.data.localeCompare(a.data));
  return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="muted">${lista.length} evolução(ões)</span><button class="small" onclick="novaEvolucao('${p.id}',hojeIso())">Nova evolução</button></div>
  <div class="list">${lista.map(e => cartaoRegistro(e, 'evolucoes')).join('') || '<div class="empty">Nenhuma evolução ainda. Use “Evoluir” na agenda.</div>'}</div>`;
}
function formEvolucao(e, onSave) {
  const p = pac(e.pacienteId);
  formRegistro(e, 'Evolução', onSave,
    `<label class="field"><span>Treino</span><select id="r-treino" name="treino"><option value="">Nenhum</option>${(p.treinos || []).map(t => `<option ${t.letra === e.treino ? 'selected' : ''}>${t.letra}</option>`).join('')}</select></label>`,
    e.id ? `<button type="button" class="danger" onclick="excluirComDesfazer('evolucoes','${e.id}','Evolução excluída')">Excluir</button>` : '');
}
window.novaEvolucao = (pid, data) => {
  const p = pac(pid), t = treinoDoDia(p, data);
  const e = { pacienteId: pid, data, treino: t ? t.letra : '', campos: S.modelo.map(c => ({ ...c, valor: '' })) };
  const conduta = e.campos.find(c => /conduta|exerc/i.test(c.rotulo));
  if (conduta && t) conduta.valor = (t.exercicios || []).filter(x => x.nome).map(x => `${x.nome}${prescricao(x) ? ' — ' + prescricao(x) : ''}`).join('\n');
  formEvolucao(e, ev => salvar(async () => {
    await store.put('evolucoes', { ...ev, id: uid() });
    // Evoluir marca o atendimento como realizado
    const s = sessoesDoDia(ev.data).find(x => x.pacienteId === pid);
    if (s && s.status !== 'realizado') await store.put('sessoes', { id: s.id, pacienteId: pid, data: s.data, horario: s.horario, horarioFim: s.horarioFim || '', avulsa: !!s.avulsa, treino: ev.treino || '', status: 'realizado' });
  }, 'Evolução salva'));
};
window.abrirEvolucao = id => {
  const e = JSON.parse(JSON.stringify(S.evolucoes.find(x => x.id === id)));
  formEvolucao(e, ev => salvar(() => store.put('evolucoes', ev), 'Evolução atualizada'));
};

// ---------- Treinos ----------
let timerTreino = null;
function salvarTreinosDepois(p) { clearTimeout(timerTreino); timerTreino = setTimeout(() => salvar(() => store.put('pacientes', p)), 700); }
function pTreinos(p) {
  const lista = p.treinos || [];
  S.treinoIdx = Math.min(S.treinoIdx, Math.max(0, lista.length - 1));
  const t = lista[S.treinoIdx];
  const hoje = treinoDoDia(p, hojeIso());
  return `
  <div class="row" style="margin-bottom:14px;gap:6px">
    ${lista.map((x, i) => `<button class="${i === S.treinoIdx ? '' : 'ghost'} small" onclick="S.treinoIdx=${i};render()">Treino ${x.letra}</button>`).join('')}
    ${lista.length < LETRAS.length ? `<button class="link small" onclick="addTreino()">+ Treino ${LETRAS[lista.length]}</button>` : ''}
  </div>
  ${t ? `<div class="item">
    <div class="row" style="gap:10px;flex-wrap:nowrap"><span class="letter-badge">${t.letra}</span>
      <input id="t-nome" class="tname" style="flex:1;min-width:0" placeholder="Dê um nome (ex.: Membros inferiores)" value="${esc(t.nome)}" oninput="campoTreino('nome',this.value)"></div>
    <div class="ex-edit ex-head"><span>Exercício</span><span>Séries</span><span>Reps/tempo</span><span>Carga</span><span></span></div>
    ${(t.exercicios || []).map((x, i) => `<div class="ex-edit ex-block">
      <input class="nome" id="e${i}n" placeholder="Exercício" value="${esc(x.nome)}" oninput="campoEx(${i},'nome',this.value)">
      <input id="e${i}s" placeholder="Séries" inputmode="numeric" value="${esc(x.series)}" oninput="campoEx(${i},'series',this.value)">
      <input id="e${i}r" placeholder="Reps" value="${esc(x.reps)}" oninput="campoEx(${i},'reps',this.value)">
      <input id="e${i}c" placeholder="Carga" value="${esc(x.carga)}" oninput="campoEx(${i},'carga',this.value)">
      <button class="x" aria-label="Remover exercício" onclick="removerEx(${i})">×</button>
    </div>`).join('')}
    <label class="field"><span>Orientações</span><textarea id="t-obs" placeholder="Ex.: descanso de 60 s entre séries, gelo após o treino" oninput="campoTreino('obs',this.value)">${esc(t.obs)}</textarea></label>
    <div class="actions" style="justify-content:space-between">
      <div class="row" style="gap:6px"><button class="ghost small" onclick="addEx()">+ Exercício</button>
      ${p.celular ? `<a class="btn wa small" target="_blank" rel="noopener" href="${waLink(p.celular, textoTreino(p, t))}">Enviar pelo WhatsApp</a>` : `<button class="ghost small" onclick="copiarTexto(textoTreino(pac('${p.id}'),pac('${p.id}').treinos[${S.treinoIdx}]),'Treino copiado')">Copiar treino</button>`}</div>
      <div class="row" style="gap:4px"><button class="link small" onclick="duplicarTreino()">Duplicar</button><button class="danger small" onclick="confirmar('Excluir o treino ${t.letra}?', excluirTreino)">Excluir</button></div>
    </div>
  </div>
  ${hoje ? `<p class="sub">Próximo no rodízio hoje: Treino ${hoje.letra}.</p>` : ''}` : '<div class="empty">Nenhum treino ainda. Toque em “+ Treino A”.</div>'}`;
}
window.textoTreino = (p, t) => `Olá, ${(p.nome || '').split(' ')[0]}! Segue seu treino ${t.letra}${t.nome ? ' (' + t.nome + ')' : ''}:\n\n` +
  (t.exercicios || []).filter(x => x.nome).map((x, i) => `${i + 1}. ${x.nome}${prescricao(x) ? ' — ' + prescricao(x) : ''}`).join('\n') + (t.obs ? `\n\n${t.obs}` : '') + `\n\n${S.config.profissional || 'Beatriz'} · Fisioterapia`;
const pAtual = () => pac(S.pid);
const reletrar = p => p.treinos.forEach((t, i) => t.letra = LETRAS[i]);
const novoEx = () => ({ nome: '', series: '', reps: '', carga: '' });
window.campoTreino = (c, v) => { const p = pAtual(); p.treinos[S.treinoIdx][c] = v; salvarTreinosDepois(p); };
window.campoEx = (i, c, v) => { const p = pAtual(); p.treinos[S.treinoIdx].exercicios[i][c] = v; salvarTreinosDepois(p); };
function mudarTreinos(fn) { const p = pAtual(); p.treinos = p.treinos || []; fn(p); reletrar(p); render(); clearTimeout(timerTreino); salvar(() => store.put('pacientes', p)); }
window.addTreino = () => mudarTreinos(p => { p.treinos.push({ nome: '', obs: '', exercicios: [novoEx(), novoEx()] }); S.treinoIdx = p.treinos.length - 1; });
window.duplicarTreino = () => mudarTreinos(p => { if (p.treinos.length >= LETRAS.length) return; p.treinos.push(JSON.parse(JSON.stringify(p.treinos[S.treinoIdx]))); S.treinoIdx = p.treinos.length - 1; });
window.excluirTreino = () => mudarTreinos(p => p.treinos.splice(S.treinoIdx, 1));
window.addEx = () => mudarTreinos(p => p.treinos[S.treinoIdx].exercicios.push(novoEx()));
window.removerEx = i => mudarTreinos(p => p.treinos[S.treinoIdx].exercicios.splice(i, 1));

// ---------- Financeiro do paciente ----------
function pFinanceiro(p) {
  const lista = S.pagamentos.filter(g => g.pacienteId === p.id).sort((a, b) => b.data.localeCompare(a.data));
  const pago = lista.filter(g => g.status === 'pago').reduce((s, g) => s + (Number(g.valor) || 0), 0);
  const pend = lista.filter(g => g.status === 'pendente').reduce((s, g) => s + (Number(g.valor) || 0), 0);
  const sp = saldoPacote(p);
  return `
  <div class="stats">
    <div class="stat"><span class="label">Total pago</span><strong style="font-size:1.2rem">${reais(pago)}</strong></div>
    <div class="stat"><span class="label">Pendente</span><strong style="font-size:1.2rem;color:${pend ? 'var(--danger)' : 'inherit'}">${reais(pend)}</strong></div>
    <div class="stat"><span class="label">Pacote</span>${sp ? `<div class="stat-anel">${anelPacote(sp)}<div><strong>${sp.saldo}</strong><span class="muted" style="display:block;font-size:.8rem">${sp.usadas} de ${sp.compradas} usadas</span></div></div>` : '<strong>—</strong><span class="muted" style="font-size:.8rem">sem pacote</span>'}</div>
    <div class="stat"><span class="label">Valor da sessão</span><strong style="font-size:1.2rem">${p.valorSessao ? reais(String(p.valorSessao).replace(',', '.')) : '—'}</strong></div>
  </div>
  <div class="row" style="margin-top:16px;gap:8px"><button class="small" onclick="novoPagamento('${p.id}','sessao')">Registrar pagamento</button><button class="ghost small" onclick="novoPagamento('${p.id}','pacote')">Vender pacote</button></div>
  <div class="section">${lista.length ? `<div class="item">${lista.map(linhaPagamento).join('')}</div>` : '<div class="empty">Nenhum pagamento registrado.</div>'}</div>`;
}
function linhaPagamento(g) {
  const p = pac(g.pacienteId);
  return `<div class="tline" data-reg="pagamentos:${esc(g.id)}" style="align-items:center">
    <div style="min-width:0"><div>${esc(g.descricao || (g.tipo === 'pacote' ? `Pacote ${g.qtd} sessões` : 'Sessão'))}${S.aba === 'financeiro' && p ? ` <span class="muted">· ${esc(nome(p))}</span>` : ''}</div>
    <div class="muted num" style="font-size:.82rem">${br(g.data)}${g.forma ? ' · ' + esc(g.forma) : ''}</div></div>
    <div class="row" style="gap:8px;flex-wrap:nowrap"><span class="num" style="font-weight:600">${reais(g.valor)}</span>
    <button class="pill ${g.status === 'pago' ? 'green' : 'red'}" style="border:0;cursor:pointer" onclick="editarPagamento('${g.id}')">${g.status === 'pago' ? 'Pago' : 'Pendente'}</button></div>
  </div>`;
}
function formPagamento(g) {
  const p = pac(g.pacienteId);
  sheet(`<h3>${g.tipo === 'pacote' ? 'Pacote de sessões' : 'Pagamento'}${p ? ' · ' + esc(nome(p)) : ''}</h3>
    ${!p ? `<label class="field"><span>Paciente</span><select id="g-p" name="pid">${ordenar(S.pacientes).map(x => `<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></label>` : ''}
    <div class="row">
      ${g.tipo === 'pacote' ? `<label class="field"><span>Sessões no pacote</span><input id="g-q" name="qtd" inputmode="numeric" required value="${esc(g.qtd || 10)}"></label>` : ''}
      <label class="field"><span>Valor (R$)</span><input id="g-v" name="valor" inputmode="decimal" required value="${esc(g.valor ? String(g.valor).replace('.', ',') : '')}"></label>
      <label class="field"><span>Data</span><input id="g-d" type="date" name="data" required value="${g.data}"></label>
    </div>
    <label class="field"><span>Descrição</span><input id="g-desc" name="descricao" value="${esc(g.descricao)}" placeholder="${g.tipo === 'pacote' ? 'Pacote 10 sessões' : 'Sessão de fisioterapia'}"></label>
    <div class="row">
      <label class="field"><span>Forma</span><select id="g-f" name="forma">${['Pix', 'Dinheiro', 'Cartão de crédito', 'Cartão de débito', 'Transferência', 'Convênio'].map(f => `<option ${g.forma === f ? 'selected' : ''}>${f}</option>`).join('')}</select></label>
      <label class="field"><span>Situação</span><select id="g-s" name="status"><option value="pago" ${g.status !== 'pendente' ? 'selected' : ''}>Pago</option><option value="pendente" ${g.status === 'pendente' ? 'selected' : ''}>Pendente</option></select></label>
    </div>`,
    f => {
      const valor = Number(String(f.get('valor')).replace(/\./g, '').replace(',', '.'));
      if (!valor) { toast('Informe um valor válido'); return false; }
      salvar(() => store.put('pagamentos', { ...g, id: g.id || uid(), pacienteId: g.pacienteId || f.get('pid'), valor, data: f.get('data'), descricao: f.get('descricao'), forma: f.get('forma'), status: f.get('status'), qtd: g.tipo === 'pacote' ? Number(f.get('qtd')) || 0 : undefined }), 'Pagamento salvo');
    },
    g.id ? `<button type="button" class="danger" onclick="excluirComDesfazer('pagamentos','${g.id}','Lançamento excluído')">Excluir</button>` : '');
}
window.novoPagamento = (pid, tipo) => {
  const p = pac(pid), v = p?.valorSessao ? Number(String(p.valorSessao).replace(',', '.')) : '';
  formPagamento({ pacienteId: pid || '', tipo, data: hojeIso(), status: 'pago', valor: tipo === 'pacote' && v ? v * 10 : v, qtd: 10, forma: 'Pix', descricao: '' });
};
window.editarPagamento = id => formPagamento(JSON.parse(JSON.stringify(S.pagamentos.find(g => g.id === id))));

// ---------- Documentos ----------
const DOCS = {
  atestado: { nome: 'Atestado de comparecimento', precisa: ['data', 'hora'] },
  declaracao: { nome: 'Declaração de tratamento', precisa: [] },
  recibo: { nome: 'Recibo', precisa: ['valor'] },
  relatorio: { nome: 'Relatório fisioterapêutico', precisa: [] },

};
function dataExtenso(di) { const d = deIso(di); return `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`; }
function textoDocumento(tipo, p, o) {
  const prof = S.config.profissional || 'Beatriz', reg = S.config.registro ? `\nCREFITO ${S.config.registro}` : '';
  const ass = `\n\n${S.config.cidade ? S.config.cidade + ', ' : ''}${dataExtenso(hojeIso())}.\n\n\n_______________________________\n${prof}\nFisioterapeuta${reg}`;
  const doc = p.cpf ? `, CPF ${p.cpf}` : '';
  const sess = sessoesEntre(p.inicio || hojeIso(), hojeIso()).filter(s => s.pacienteId === p.id && s.status === 'realizado').length;
  const aval = S.avaliacoes.filter(a => a.pacienteId === p.id).sort((a, b) => b.data.localeCompare(a.data))[0];
  const campo = re => aval?.campos?.find(c => re.test(c.rotulo))?.valor || '';
  const evos = S.evolucoes.filter(e => e.pacienteId === p.id).sort((a, b) => a.data.localeCompare(b.data));
  const ultima = evos[evos.length - 1];
  const resp = ultima?.campos?.find(c => /resposta/i.test(c.rotulo))?.valor || '';
  if (tipo === 'atestado') return `ATESTADO DE COMPARECIMENTO\n\nAtesto, para os devidos fins, que ${p.nome}${doc} esteve em atendimento fisioterapêutico no dia ${br(o.data)}${o.hora ? `, no período das ${o.hora}` : ''}.${ass}`;
  if (tipo === 'declaracao') return `DECLARAÇÃO\n\nDeclaro que ${p.nome}${doc} está em tratamento fisioterapêutico sob meus cuidados desde ${br(p.inicio) || '—'}${p.diagnostico ? `, em razão de ${p.diagnostico}` : ''}, com frequência de ${(p.dias || []).length} vez(es) por semana (${(p.dias || []).map(d => DIAS_LONGO[d].toLowerCase()).join(', ')}).${ass}`;
  if (tipo === 'recibo') return `RECIBO\n\nRecebi de ${p.responsavel || p.nome}${p.responsavel ? '' : doc} a quantia de ${reais(o.valor)} referente a ${o.ref || 'atendimento(s) de fisioterapia'}${p.responsavel ? `, prestado(s) a ${p.nome}` : ''}.${ass}`;
  if (tipo === 'relatorio') return `RELATÓRIO FISIOTERAPÊUTICO\n\nPaciente: ${p.nome}${p.nascimento ? ` (${idade(p.nascimento)} anos)` : ''}\nDiagnóstico: ${p.diagnostico || '—'}\nInício do tratamento: ${br(p.inicio) || '—'}\nSessões realizadas: ${sess}\n\nAvaliação (${aval ? br(aval.data) : '—'}):\n${campo(/queixa/i) || '—'}\n\nDiagnóstico cinético-funcional:\n${campo(/cinético/i) || '—'}\n\nObjetivos:\n${campo(/objetivo/i) || '—'}\n\nConduta:\n${campo(/plano/i) || '—'}\n\nEvolução:\n${resp || '—'}${ass}`;
  if (tipo === 'alta') return `RELATÓRIO DE ALTA FISIOTERAPÊUTICA\n\nPaciente: ${p.nome}\nDiagnóstico: ${p.diagnostico || '—'}\nPeríodo: ${br(p.inicio) || '—'} a ${br(hojeIso())}\nSessões realizadas: ${sess}\n\nObjetivos iniciais:\n${campo(/objetivo/i) || '—'}\n\nCondição na alta:\n${resp || '—'}\n\nOrientações:\nManter os exercícios domiciliares orientados e retornar em caso de piora dos sintomas.${ass}`;
}

window.baixarDocumento = titulo => {
  const txt = $('#d-txt').value;

function vFinanceiro() {
  const mes = S.mes || mesAtual(), [a, m] = mes.split('-').map(Number);
  const doMes = S.pagamentos.filter(g => g.data.startsWith(mes)).sort((x, y) => y.data.localeCompare(x.data));
  const recebido = doMes.filter(g => g.status === 'pago').reduce((s, g) => s + (Number(g.valor) || 0), 0);
  const pendente = S.pagamentos.filter(g => g.status === 'pendente').reduce((s, g) => s + (Number(g.valor) || 0), 0);
  const meta = Number(S.config.metaLucro) || 0;
  const ses = sessoesEntre(mes + '-01', iso(new Date(a, m, 0)) < hojeIso() ? iso(new Date(a, m, 0)) : hojeIso());
  const realizadas = ses.filter(s => s.status === 'realizado').length;
  // Últimos 6 meses
  const meses = [...Array(6)].map((_, i) => { const d = new Date(a, m - 1 - (5 - i), 1); return iso(d).slice(0, 7); });
  const tot = meses.map(k => S.pagamentos.filter(g => g.status === 'pago' && g.data.startsWith(k)).reduce((s, g) => s + (Number(g.valor) || 0), 0));
  const max = Math.max(meta, ...tot, 1);
  const porForma = {}; doMes.filter(g => g.status === 'pago').forEach(g => porForma[g.forma || 'Outro'] = (porForma[g.forma || 'Outro'] || 0) + Number(g.valor));
  const mudaMes = d => { const x = new Date(a, m - 1 + d, 1); return iso(x).slice(0, 7); };
  return `
  <div class="head"><div><h2>Financeiro</h2><p class="sub">${MESES[m - 1]} de ${a}</p></div>
    <div class="row" style="gap:6px"><div class="weeknav"><button onclick="S.mes='${mudaMes(-1)}';render()" aria-label="Mês anterior">‹</button><span>${MESES[m - 1].slice(0, 3)}</span><button onclick="S.mes='${mudaMes(1)}';render()" aria-label="Próximo mês">›</button></div>
    <button class="small" onclick="novoPagamento('','sessao')">Lançar</button></div></div>
  <div class="stats">
    <div class="stat"><span class="label">Recebido</span><strong style="font-size:1.25rem">${reais(recebido)}</strong></div>
    <div class="stat"><span class="label">A receber</span><strong style="font-size:1.25rem;color:${pendente ? 'var(--danger)' : 'inherit'}">${reais(pendente)}</strong><span class="muted" style="font-size:.8rem">todos os meses</span></div>
    <div class="stat"><span class="label">Sessões realizadas</span><strong>${realizadas}</strong><span class="muted" style="font-size:.8rem">${realizadas ? reais(recebido / realizadas) + ' por sessão' : ''}</span></div>
    <div class="stat"><span class="label">Meta do mês</span><strong style="font-size:1.25rem">${meta ? Math.round(recebido / meta * 100) + '%' : '—'}</strong>
      ${meta ? `<div class="bar"><i style="width:${Math.min(100, recebido / meta * 100)}%"></i></div>` : '<button class="link small" style="justify-self:start;padding:0" onclick="ir(\'ajustes\')">Definir meta</button>'}</div>
  </div>
  <div class="section"><h3>Últimos 6 meses</h3>
    <div class="item"><svg class="grafico" viewBox="0 0 600 180" style="width:100%;height:auto" role="img" aria-label="Recebido por mês">
      ${meta ? `<line x1="0" x2="600" y1="${150 - meta / max * 130}" y2="${150 - meta / max * 130}" stroke="var(--yellow)" stroke-dasharray="4 4"/><text x="596" y="${144 - meta / max * 130}" text-anchor="end" font-size="11" fill="var(--muted)">meta</text>` : ''}
      ${tot.map((v, i) => { const h = v / max * 130, x = i * 100 + 25; return `<rect class="barra" style="animation-delay:${i * 80}ms" x="${x}" y="${150 - h}" width="50" height="${Math.max(h, 1)}" rx="6" fill="${meses[i] === mes ? 'var(--green)' : 'var(--green-soft)'}"/>
        <text x="${x + 25}" y="168" text-anchor="middle" font-size="12" fill="var(--muted)">${MESES[Number(meses[i].slice(5)) - 1].slice(0, 3)}</text>
        ${v ? `<text class="val" x="${x + 25}" y="${144 - h}" text-anchor="middle" font-size="11" fill="var(--fg)">${Math.round(v).toLocaleString('pt-BR')}</text>` : ''}`; }).join('')}
    </svg></div>
  </div>
  ${Object.keys(porForma).length ? `<div class="section"><h3>Por forma de pagamento</h3><div class="item">${Object.entries(porForma).sort((x, y) => y[1] - x[1]).map(([f, v]) => `<div class="tline"><span>${esc(f)}</span><span class="num">${reais(v)}</span></div>`).join('')}</div></div>` : ''}
  <div class="section"><h3>Lançamentos do mês</h3>${doMes.length ? `<div class="item">${doMes.map(linhaPagamento).join('')}</div>` : '<div class="empty">Nenhum lançamento neste mês.</div>'}</div>`;
}

// Fotos: reduz no próprio aparelho (até 1800 px, JPEG) antes de enviar
function reduzirFoto(arq, max = 1800) {
  return new Promise((ok, falha) => {
    const img = new Image(), url = URL.createObjectURL(arq);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? ok(b) : falha(new Error('Não deu para ler a foto.')), 'image/jpeg', .84);
    };
    img.onerror = () => falha(new Error('Esse arquivo não parece ser uma foto.'));
    img.src = url;
  });
}
window.trocarFotoSite = async (slot, arq) => {
  if (!arq) return;
  const caixa = document.querySelector(`[data-slot="${slot}"] .img`); caixa?.classList.add('enviando');
  try {
    const blob = await reduzirFoto(arq);
    const r = await fetch('/api/admin/fotos/' + slot, { method: 'PUT', credentials: 'same-origin', headers: { 'content-type': 'image/jpeg' }, body: blob });
    const c = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(c.erro || 'Não deu para enviar a foto.');
    await carregarSite(); render();
    const nova = document.querySelector(`[data-slot="${slot}"] img`); nova?.classList.add('nova');
    toast('Foto trocada no site');
  } catch (e) { toast(e.message); caixa?.classList.remove('enviando'); }
};

const ICONES_HIST = [[/exclu|bloquead|errad|apagou/i, '⚠️', 'perigo'], [/pagamento|pagou/i, '💰', ''], [/entrou/i, '🔑', ''], [/senha|verificação/i, '🔒', 'alerta'], [/criou conta|teste/i, '🌱', ''], [/comunicado/i, '📣', ''], [/foto/i, '🖼️', ''], [/ajustes|preço|promo/i, '🏷️', ''], [/editou|motivo/i, '✏️', 'alerta']];
function vAdmHistorico() {
  if (!S.admHist) { S.admHist = 'carregando'; api('admin/historico').then(r => { S.admHist = r.historico; render(); }).catch(e => { S.admHist = []; toast(e.message); }); }
  if (!Array.isArray(S.admHist)) return esqueleto();
  const q = (S.buscaHist || '').toLowerCase(), filtro = S.filtroHist || 'tudo';
  const grupos = { tudo: () => true, entradas: h => /entrou|senha errada|bloquead|código/i.test(h.acao), dinheiro: h => /pag/i.test(h.acao), contas: h => /conta|editou|motivo|exclu/i.test(h.acao), site: h => /ajustes|foto|comunicado/i.test(h.acao) };
  const lista = S.admHist.filter(h => grupos[filtro](h) && (!q || (h.quem + ' ' + h.acao + ' ' + h.detalhe).toLowerCase().includes(q)));
  let dia = '';
  return `
  <div class="row" style="gap:6px;margin-bottom:10px"><button class="ghost small" onclick="S.admHist=null;render()">Atualizar</button></div>
  <input class="search" id="busca-hist" placeholder="Buscar por pessoa ou ação" value="${esc(S.buscaHist || '')}" oninput="S.buscaHist=this.value;render()">
  <div class="chips">${[['tudo', 'Tudo'], ['entradas', 'Entradas'], ['dinheiro', 'Pagamentos'], ['contas', 'Contas'], ['site', 'Site']].map(([k, n]) => `<button class="chip ${filtro === k ? 'on' : ''}" onclick="S.filtroHist='${k}';render()">${n}</button>`).join('')}</div>
  ${lista.length ? `<div class="item" style="gap:0">${lista.slice(0, 200).map((h, i) => {
    const d = new Date(h.quando), chave = d.toLocaleDateString('pt-BR');
    const [, ic, cls] = ICONES_HIST.find(([re]) => re.test(h.acao)) || [0, '•', ''];
    const cab = chave !== dia ? `<div class="hist-dia">${chave === new Date().toLocaleDateString('pt-BR') ? 'Hoje' : chave}</div>` : '';
    dia = chave;
    return `${cab}<div class="hist-linha" style="animation-delay:${Math.min(i, 12) * 30}ms"><span class="ic ${cls}">${ic}</span><div style="min-width:0"><div>${esc(h.acao)}${h.detalhe ? ` <span class="muted">· ${esc(h.detalhe)}</span>` : ''}</div><div class="q">${esc(h.quem)}${h.ip && h.ip !== 'local' ? ' · ' + esc(h.ip) : ''}</div></div><time>${d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</time></div>`;
  }).join('')}</div>` : '<div class="empty">Nada registrado ainda.</div>'}
  <p class="sub">O histórico guarda entradas, pagamentos, mudanças nas contas e no site. Os endereços de internet (IP) ajudam a reconhecer acessos estranhos.</p>`;
}

// ---------- Planilhas (abrem no Excel ou Google Planilhas) ----------
function baixarCSV(nome, cab, linhas) {
  const cel = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const texto = '\ufeff' + [cab.join(';'), ...linhas.map(l => l.map(cel).join(';'))].join('\r\n');
  const url = URL.createObjectURL(new Blob([texto], { type: 'text/csv;charset=utf-8' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: nome });
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Planilha baixada');
}
