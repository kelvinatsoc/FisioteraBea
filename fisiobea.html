<title>FisioBea</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna calma, cabeçalho branco, navegação inferior no celular e superior no tablet */
:root {
  --bg: #fbfcfb;
  --surface: #ffffff;
  --fg: #17241c;
  --muted: #6c7a71;
  --line: #e7ece8;
  --green: #1e7a46;
  --green-soft: #eaf4ee;
  --yellow: #e9b821;
  --yellow-soft: #fdf5d9;
  --danger: #b4382c;
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101612; --surface: #161e19; --fg: #e8efe9; --muted: #93a398; --line: #26312a;
  --green: #5cc189; --green-soft: #1b2c22; --yellow: #f0c94a; --yellow-soft: #2c2715; --danger: #ef7d70; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101612; --surface: #161e19; --fg: #e8efe9; --muted: #93a398; --line: #26312a;
  --green: #5cc189; --green-soft: #1b2c22; --yellow: #f0c94a; --yellow-soft: #2c2715; --danger: #ef7d70; color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }

.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; letter-spacing: -.01em; }
.brand svg { width: 30px; height: 30px; }
.brand span b { color: var(--green); font-weight: 700; }

nav.tabs { display: flex; gap: 4px; }
nav.tabs button { background: none; border: 0; color: var(--muted); font: 500 .95rem var(--font); padding: 8px 12px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
nav.tabs button svg { width: 20px; height: 20px; }
nav.tabs button.on { color: var(--green); background: var(--green-soft); }

main { padding-block: 20px 110px; }
h2 { font-size: 1.5rem; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.sub { color: var(--muted); font-size: .9rem; margin: 2px 0 0; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

button, .btn { font: 600 .92rem var(--font); border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; background: var(--green); color: #fff; }
:root:not([data-theme="light"]) button.primary-dark { color: #fff; }
.ghost { background: transparent; color: var(--green); border: 1px solid var(--line); }
.link { background: none; color: var(--green); padding: 6px 4px; }
.danger { background: none; color: var(--danger); padding: 6px 4px; }
.small { padding: 7px 12px; font-size: .85rem; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }

input, select, textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; }
textarea { min-height: 84px; resize: vertical; line-height: 1.45; }
.field { display: grid; gap: 6px; }
.field > span { font-size: .85rem; font-weight: 600; color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .field { flex: 1 1 140px; min-width: 0; }

/* Agenda */
.days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 20px; }
.day { background: none; color: var(--fg); border: 1px solid transparent; padding: 10px 0; border-radius: 14px; display: grid; gap: 2px; justify-items: center; }
.day small { color: var(--muted); font-weight: 500; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
.day strong { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.day i { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
.day.has i { background: var(--yellow); }
.day.on { background: var(--green); color: #fff; }
.day.on small { color: rgba(255,255,255,.8); }
.day.today:not(.on) { border-color: var(--line); }
.weeknav { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.weeknav button { background: none; color: var(--muted); padding: 6px 10px; font-size: 1.1rem; }

.list { display: grid; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
.item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.item h3 { margin: 0; font-size: 1.05rem; }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; font-weight: 600; min-width: 46px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--yellow-soft); color: var(--fg); white-space: nowrap; }
.pill.done { background: var(--green-soft); color: var(--green); }
.pill.letter { background: var(--green-soft); color: var(--green); }
.muted { color: var(--muted); }
.ex { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: .92rem; }
.ex li { display: flex; justify-content: space-between; gap: 10px; border-top: 1px dashed var(--line); padding-top: 6px; }
.ex li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.empty { text-align: center; padding: 40px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; }

/* Treinos */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
.chip { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; white-space: nowrap; font-weight: 500; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.ex-edit { display: grid; grid-template-columns: 1fr 64px 90px 80px 32px; gap: 6px; align-items: center; }
.ex-edit input { padding: 9px 10px; font-size: .92rem; }
.ex-edit .x { background: none; color: var(--muted); padding: 4px; font-size: 1.1rem; }
.ex-head { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
@media (max-width: 560px) {
  .ex-edit { grid-template-columns: 1fr 1fr 1fr 32px; }
  .ex-edit .nome { grid-column: 1 / -1; }
  .ex-head { display: none; }
  .ex-block { border-top: 1px solid var(--line); padding-top: 8px; }
}
.letter-badge { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--yellow); color: #1b1b1b; font-weight: 700; flex: none; }
.tname { border: 0; padding: 4px 0; font-weight: 600; font-size: 1.05rem; background: none; }

/* Evoluções */
.evo dl { margin: 0; display: grid; gap: 10px; }
.evo dt { font-size: .78rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.evo dd { margin: 2px 0 0; white-space: pre-wrap; line-height: 1.5; }
.vitals { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .9rem; font-variant-numeric: tabular-nums; }
.vitals b { color: var(--muted); font-weight: 600; margin-right: 4px; }

/* Modelo */
.mf { display: grid; grid-template-columns: 1fr 130px auto auto auto; gap: 6px; align-items: center; }
.mf button { background: none; color: var(--muted); padding: 6px 8px; }
@media (max-width: 560px) { .mf { grid-template-columns: 1fr auto auto auto; } .mf select { grid-column: 1 / -1; grid-row: 2; } }

/* Folha (formulários) */
.sheet-bg { position: fixed; inset: 0; background: rgba(10, 20, 14, .4); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: min(640px, 100%); max-height: 92%; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
@media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 20px; } }
.sheet h3 { margin: 0; font-size: 1.2rem; }
.sheet-foot { display: flex; justify-content: space-between; gap: 8px; align-items: center; position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom, 0px)); background: var(--surface); padding-block: 12px; border-top: 1px solid var(--line); }
.sheet-foot .row { margin-left: auto; }
.weekpick { display: flex; gap: 6px; flex-wrap: wrap; }
.weekpick label { display: inline-flex; }
.weekpick input { display: none; }
.weekpick span { border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer; font-weight: 500; font-size: .9rem; }
.weekpick input:checked + span { background: var(--green); border-color: var(--green); color: #fff; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .9rem; z-index: 30; }
.banner { background: var(--yellow-soft); border-radius: 12px; padding: 10px 14px; font-size: .88rem; margin-bottom: 16px; }

/* Navegação inferior no celular */
@media (max-width: 699px) {
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); justify-content: space-around; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  nav.tabs button { flex-direction: column; gap: 2px; font-size: .72rem; padding: 6px 8px; border-radius: 12px; }
}
@media (min-width: 700px) { nav.tabs button svg { display: none; } }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="none" stroke="var(--yellow)" stroke-width="2"/><path d="M16 6v20" stroke="var(--green)" stroke-width="2.4" stroke-linecap="round"/><path d="M11 10c3 0 5 2 5 4s-2 4-5 4-3 2 0 4c2 1 5 1 5 3" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Fisio<b>Bea</b></span>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap" id="app"></main>
<div id="layer"></div>

<script>
const DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const DIAS_LONGO = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const LETRAS = 'ABCDEF'.split('');
const MODELO_PADRAO = [
  { rotulo: 'Queixa / como chegou', tipo: 'texto' },
  { rotulo: 'PA (mmHg)', tipo: 'linha' },
  { rotulo: 'FC (bpm)', tipo: 'linha' },
  { rotulo: 'SpO2 (%)', tipo: 'linha' },
  { rotulo: 'Dor (EVA 0-10)', tipo: 'linha' },
  { rotulo: 'Conduta / exercícios realizados', tipo: 'texto' },
  { rotulo: 'Resposta ao tratamento', tipo: 'texto' },
  { rotulo: 'Plano para a próxima sessão', tipo: 'texto' },
];
const ICON = {
  agenda: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  pacientes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
  treinos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>',
  evolucoes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg>',
  modelo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
};
const ABAS = [['agenda', 'Agenda'], ['pacientes', 'Pacientes'], ['treinos', 'Treinos'], ['evolucoes', 'Evoluções'], ['modelo', 'Modelo']];

// ---------- Estado ----------
const S = { aba: 'agenda', pacientes: [], evolucoes: [], modelo: MODELO_PADRAO, semana: 0, dia: null, pac: null, treinoIdx: 0, carregado: false, nuvem: false };
let store = null; // camada de dados: nuvem (db) ou navegador

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const deIso = s => { const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d); };
const br = s => s ? s.split('-').reverse().join('/') : '';
const pac = id => S.pacientes.find(p => p.id === id);
const ordenar = l => l.slice().sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

// ---------- Dados ----------
async function iniciarDados() {
  for (let i = 0; i < 30 && !window.claude?.use; i++) await new Promise(r => setTimeout(r, 100));
  const db = window.claude?.use ? await window.claude.use('db') : null;
  if (db) {
    S.nuvem = true;
    store = {
      salvarPaciente: p => db.doc('pacientes/' + p.id).set(p),
      apagarPaciente: id => db.doc('pacientes/' + id).delete(),
      salvarEvolucao: e => db.doc('evolucoes/' + e.id).set(e),
      apagarEvolucao: id => db.doc('evolucoes/' + id).delete(),
      salvarModelo: m => db.doc('config/modelo').set({ campos: m }),
    };
    const erro = () => { S.erro = 'Não foi possível carregar seus dados. Verifique sua conexão e recarregue a página.'; render(); };
    db.collection('pacientes').onSnapshot(s => { S.pacientes = s.docs.map(d => ({ ...d.data(), id: d.id })); S.carregado = true; render(); }, erro);
    db.collection('evolucoes').onSnapshot(s => { S.evolucoes = s.docs.map(d => ({ ...d.data(), id: d.id })); render(); }, erro);
    db.doc('config/modelo').onSnapshot(s => { if (s.exists && s.data().campos?.length) S.modelo = s.data().campos; render(); }, erro);
  } else {
    // fora do claude.ai: guarda no navegador
    const KEY = 'fisiobea';
    let d = {}; try { d = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
    S.pacientes = d.pacientes || []; S.evolucoes = d.evolucoes || []; S.modelo = d.modelo || MODELO_PADRAO; S.carregado = true;
    const gravar = () => { try { localStorage.setItem(KEY, JSON.stringify({ pacientes: S.pacientes, evolucoes: S.evolucoes, modelo: S.modelo })); } catch (e) {} };
    const up = (lista, obj) => { const i = S[lista].findIndex(x => x.id === obj.id); i < 0 ? S[lista].push(obj) : (S[lista][i] = obj); gravar(); render(); };
    store = {
      salvarPaciente: async p => up('pacientes', p),
      apagarPaciente: async id => { S.pacientes = S.pacientes.filter(p => p.id !== id); gravar(); render(); },
      salvarEvolucao: async e => up('evolucoes', e),
      apagarEvolucao: async id => { S.evolucoes = S.evolucoes.filter(e => e.id !== id); gravar(); render(); },
      salvarModelo: async m => { S.modelo = m; gravar(); render(); },
    };
    render();
  }
}
async function salvar(fn, msg) {
  try { await fn(); if (msg) toast(msg); }
  catch (e) { toast(e?.code === 'not_granted' || e?.code === 'permission_denied' ? 'Você não tem permissão para editar.' : 'Não salvou. Tente de novo.'); }
}

// ---------- Rodízio ----------
// Conta as sessões desde o início do paciente e gira A → B → C → D...
function treinoDoDia(p, dataIso) {
  const lista = p.treinos || [];
  if (!lista.length) return null;
  const inicio = deIso(p.inicio || dataIso), alvo = deIso(dataIso);
  if (alvo < inicio || !(p.dias || []).includes(alvo.getDay())) return null;
  let n = 0;
  for (let d = new Date(inicio); d < alvo; d.setDate(d.getDate() + 1)) if (p.dias.includes(d.getDay())) n++;
  return lista[n % lista.length];
}
const prescricao = x => [x.series && x.series + 'x', x.reps, x.carga].filter(Boolean).join(' · ');

// ---------- Navegação ----------
function renderTabs() {
  $('#tabs').innerHTML = ABAS.map(([k, n]) => `<button class="${S.aba === k ? 'on' : ''}" data-aba="${k}">${ICON[k]}${n}</button>`).join('');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-aba]');
  if (b) { S.aba = b.dataset.aba; render(); window.scrollTo(0, 0); }
});

function render() {
  renderTabs();
  const app = $('#app');
  if (S.erro) { app.innerHTML = `<div class="empty">${esc(S.erro)}</div>`; return; }
  if (!S.carregado) { app.innerHTML = '<div class="empty">Carregando seus pacientes…</div>'; return; }
  if (S.pac && !pac(S.pac)) S.pac = null;
  if (!S.pac && S.pacientes.length) S.pac = ordenar(S.pacientes)[0].id;
  app.innerHTML = ({ agenda: vAgenda, pacientes: vPacientes, treinos: vTreinos, evolucoes: vEvolucoes, modelo: vModelo })[S.aba]();
}

// ---------- Agenda ----------
function semanaDias() {
  const hoje = new Date();
  const seg = new Date(hoje);
  seg.setDate(hoje.getDate() - (hoje.getDay() === 0 ? -1 : hoje.getDay() - 1) + S.semana * 7);
  return [...Array(6)].map((_, i) => { const d = new Date(seg); d.setDate(seg.getDate() + i); return d; });
}
function vAgenda() {
  const dias = semanaDias(), hoje = iso(new Date());
  if (!S.dia || !dias.some(d => iso(d) === S.dia)) S.dia = (dias.find(d => iso(d) === hoje) || dias[0]) && iso(dias.find(d => iso(d) === hoje) || dias[0]);
  const sel = deIso(S.dia);
  const doDia = S.pacientes.filter(p => (p.dias || []).includes(sel.getDay())).sort((a, b) => (a.horario || '').localeCompare(b.horario || ''));
  const meses = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

  return `
  <div class="head">
    <div><h2>${DIAS_LONGO[sel.getDay()]}, ${sel.getDate()} de ${meses[sel.getMonth()]}</h2>
    <p class="sub">${doDia.length ? doDia.length + ' atendimento' + (doDia.length > 1 ? 's' : '') : 'Nenhum atendimento'}</p></div>
    <div class="weeknav"><button onclick="S.semana--;S.dia=null;render()" aria-label="Semana anterior">‹</button>${br(iso(dias[0])).slice(0, 5)} – ${br(iso(dias[5])).slice(0, 5)}<button onclick="S.semana++;S.dia=null;render()" aria-label="Próxima semana">›</button></div>
  </div>
  <div class="days">${dias.map(d => {
    const di = iso(d), tem = S.pacientes.some(p => (p.dias || []).includes(d.getDay()));
    return `<button class="day ${di === S.dia ? 'on' : ''} ${di === hoje ? 'today' : ''} ${tem ? 'has' : ''}" onclick="S.dia='${di}';render()"><small>${DIAS[d.getDay()]}</small><strong>${d.getDate()}</strong><i></i></button>`;
  }).join('')}</div>
  <div class="list">${doDia.map(p => {
    const t = treinoDoDia(p, S.dia);
    const evo = S.evolucoes.find(e => e.pacienteId === p.id && e.data === S.dia);
    return `<div class="item">
      <div class="item-top">
        <div class="row" style="gap:12px;align-items:flex-start">
          <span class="time">${esc(p.horario || '--:--')}</span>
          <div><h3>${esc(p.nome)}</h3><div class="muted" style="font-size:.88rem">${esc(p.diagnostico)}</div></div>
        </div>
        ${evo ? '<span class="pill done">✓ Evoluído</span>' : t ? `<span class="pill letter">Treino ${t.letra}</span>` : ''}
      </div>
      ${t ? `<div><div class="label" style="margin-bottom:4px">Treino ${t.letra}${t.nome ? ' · ' + esc(t.nome) : ''}</div>
        <ul class="ex">${(t.exercicios || []).filter(x => x.nome).map(x => `<li><span>${esc(x.nome)}</span><span>${esc(prescricao(x))}</span></li>`).join('')}</ul></div>`
        : '<div class="muted" style="font-size:.9rem">Nenhum treino montado ainda.</div>'}
      <div class="actions">${evo
        ? `<button class="ghost small" onclick="abrirEvolucao('${evo.id}')">Ver evolução</button>`
        : `<button class="small" onclick="novaEvolucao('${p.id}','${S.dia}')">Evoluir</button>`}</div>
    </div>`;
  }).join('') || `<div class="empty">${S.pacientes.length ? 'Dia livre. Nenhum paciente agendado.' : 'Cadastre seus pacientes para ver a agenda.'}</div>`}</div>`;
}

// ---------- Pacientes ----------
function vPacientes() {
  return `
  <div class="head"><div><h2>Pacientes</h2><p class="sub">${S.pacientes.length} cadastrado${S.pacientes.length === 1 ? '' : 's'}</p></div>
  <button onclick="editarPaciente()">Novo paciente</button></div>
  <div class="list">${ordenar(S.pacientes).map(p => `
    <div class="item">
      <div class="item-top">
        <div><h3>${esc(p.nome)}</h3><div class="muted" style="font-size:.9rem">${esc(p.diagnostico)}</div></div>
        <button class="link" onclick="editarPaciente('${p.id}')">Editar</button>
      </div>
      <div class="row" style="gap:6px">${(p.dias || []).map(d => `<span class="pill letter">${DIAS[d]}</span>`).join('')}<span class="muted" style="font-size:.9rem;margin-left:4px">${esc(p.horario)}</span></div>
      <div class="actions">
        <button class="ghost small" onclick="S.pac='${p.id}';S.treinoIdx=0;S.aba='treinos';render()">${(p.treinos || []).length} treino${(p.treinos || []).length === 1 ? '' : 's'}</button>
        <button class="ghost small" onclick="S.pac='${p.id}';S.aba='evolucoes';render()">${S.evolucoes.filter(e => e.pacienteId === p.id).length} evoluções</button>
      </div>
    </div>`).join('') || '<div class="empty">Nenhum paciente ainda. Toque em “Novo paciente” para começar.</div>'}</div>`;
}

function sheet(html, onSave, extra = '') {
  $('#layer').innerHTML = `<div class="sheet-bg" onclick="if(event.target===this)fechar()"><form class="sheet" id="sheet">${html}
    <div class="sheet-foot">${extra}<div class="row"><button type="button" class="ghost" onclick="fechar()">Cancelar</button><button type="submit">Salvar</button></div></div></form></div>`;
  $('#sheet').onsubmit = e => { e.preventDefault(); onSave(new FormData(e.target)); fechar(); };
}
window.fechar = () => { $('#layer').innerHTML = ''; };
// confirmação dentro da página (o navegador do claude.ai bloqueia confirm())
window.confirmar = (msg, acao) => {
  $('#layer').innerHTML = `<div class="sheet-bg"><div class="sheet"><h3>${esc(msg)}</h3><p class="muted" style="margin:0">Essa ação não pode ser desfeita.</p>
    <div class="row" style="justify-content:flex-end"><button class="ghost" onclick="fechar()">Cancelar</button><button style="background:var(--danger)" id="ok">Excluir</button></div></div></div>`;
  $('#ok').onclick = () => { fechar(); acao(); };
};

window.editarPaciente = id => {
  const p = id ? pac(id) : { nome: '', diagnostico: '', dias: [], horario: '', inicio: iso(new Date()), obs: '', treinos: [] };
  sheet(`
    <h3>${id ? 'Editar paciente' : 'Novo paciente'}</h3>
    <label class="field"><span>Nome</span><input id="f-nome" name="nome" required value="${esc(p.nome)}"></label>
    <label class="field"><span>Diagnóstico / objetivo</span><input id="f-diag" name="diagnostico" value="${esc(p.diagnostico)}"></label>
    <div class="field"><span>Dias de atendimento</span><div class="weekpick">${[1, 2, 3, 4, 5, 6].map(d => `<label><input type="checkbox" name="dias" value="${d}" ${(p.dias || []).includes(d) ? 'checked' : ''}><span>${DIAS[d]}</span></label>`).join('')}</div></div>
    <div class="row">
      <label class="field"><span>Horário</span><input id="f-hora" type="time" name="horario" value="${esc(p.horario)}"></label>
      <label class="field"><span>Início do rodízio</span><input id="f-ini" type="date" name="inicio" value="${esc(p.inicio)}"></label>
    </div>
    <p class="sub" style="margin:0">A partir dessa data os treinos se alternam a cada sessão: A, B, C, D…</p>
    <label class="field"><span>Observações</span><textarea id="f-obs" name="obs">${esc(p.obs)}</textarea></label>`,
    f => salvar(() => store.salvarPaciente({ ...p, id: p.id || uid(), nome: f.get('nome'), diagnostico: f.get('diagnostico'), dias: f.getAll('dias').map(Number), horario: f.get('horario'), inicio: f.get('inicio'), obs: f.get('obs') }), 'Paciente salvo'),
    id ? `<button type="button" class="danger" onclick="confirmar('Excluir ${esc(p.nome)}?', () => excluirPaciente('${id}'))">Excluir</button>` : '');
};
window.excluirPaciente = id => salvar(async () => {
  for (const e of S.evolucoes.filter(e => e.pacienteId === id)) await store.apagarEvolucao(e.id);
  await store.apagarPaciente(id);
}, 'Paciente excluído');

function seletorPaciente() {
  if (!S.pacientes.length) return '';
  return `<div class="chips">${ordenar(S.pacientes).map(p => `<button class="chip ${p.id === S.pac ? 'on' : ''}" onclick="S.pac='${p.id}';S.treinoIdx=0;render()">${esc(p.nome.split(' ')[0])}</button>`).join('')}</div>`;
}

// ---------- Treinos ----------
// Edição de treino: muda o objeto local na hora e salva o paciente com um pequeno atraso
let timerTreino = null;
function salvarTreinosDepois(p) { clearTimeout(timerTreino); timerTreino = setTimeout(() => salvar(() => store.salvarPaciente(p)), 700); }

function vTreinos() {
  const p = pac(S.pac);
  if (!p) return '<div class="head"><h2>Treinos</h2></div><div class="empty">Cadastre um paciente primeiro.</div>';
  const lista = p.treinos || [];
  S.treinoIdx = Math.min(S.treinoIdx, Math.max(0, lista.length - 1));
  const t = lista[S.treinoIdx];
  return `
  <div class="head"><div><h2>Treinos</h2><p class="sub">${esc(p.nome)} · ${(p.dias || []).map(d => DIAS[d]).join(', ') || 'sem dias definidos'}</p></div></div>
  ${seletorPaciente()}
  <div class="row" style="margin-bottom:14px;gap:6px">
    ${lista.map((x, i) => `<button class="${i === S.treinoIdx ? '' : 'ghost'} small" onclick="S.treinoIdx=${i};render()">Treino ${x.letra}</button>`).join('')}
    ${lista.length < LETRAS.length ? `<button class="link small" onclick="addTreino()">+ Treino ${LETRAS[lista.length]}</button>` : ''}
  </div>
  ${t ? `<div class="item">
    <div class="row" style="gap:10px"><span class="letter-badge">${t.letra}</span>
      <input id="t-nome" class="tname" style="flex:1;min-width:0" placeholder="Dê um nome (ex.: Membros inferiores)" value="${esc(t.nome)}" oninput="campoTreino('nome',this.value)"></div>
    <div class="ex-edit ex-head"><span>Exercício</span><span>Séries</span><span>Reps/tempo</span><span>Carga</span><span></span></div>
    ${(t.exercicios || []).map((x, i) => `<div class="ex-edit ex-block">
      <input class="nome" id="e${i}n" placeholder="Exercício" value="${esc(x.nome)}" oninput="campoEx(${i},'nome',this.value)">
      <input id="e${i}s" placeholder="Séries" inputmode="numeric" value="${esc(x.series)}" oninput="campoEx(${i},'series',this.value)">
      <input id="e${i}r" placeholder="Reps" value="${esc(x.reps)}" oninput="campoEx(${i},'reps',this.value)">
      <input id="e${i}c" placeholder="Carga" value="${esc(x.carga)}" oninput="campoEx(${i},'carga',this.value)">
      <button class="x" aria-label="Remover exercício" onclick="removerEx(${i})">×</button>
    </div>`).join('')}
    <div class="actions" style="justify-content:space-between">
      <button class="ghost small" onclick="addEx()">+ Exercício</button>
      <div class="row" style="gap:4px"><button class="link small" onclick="duplicarTreino()">Duplicar</button><button class="danger small" onclick="confirmar('Excluir o treino ${t.letra}?', excluirTreino)">Excluir</button></div>
    </div>
  </div>` : '<div class="empty">Nenhum treino ainda. Toque em “+ Treino A”.</div>'}`;
}
const pAtual = () => pac(S.pac);
const reletrar = p => p.treinos.forEach((t, i) => t.letra = LETRAS[i]);
const novoEx = () => ({ nome: '', series: '', reps: '', carga: '' });
window.campoTreino = (c, v) => { const p = pAtual(); p.treinos[S.treinoIdx][c] = v; salvarTreinosDepois(p); };
window.campoEx = (i, c, v) => { const p = pAtual(); p.treinos[S.treinoIdx].exercicios[i][c] = v; salvarTreinosDepois(p); };
function mudarTreinos(fn) { const p = pAtual(); p.treinos = p.treinos || []; fn(p); reletrar(p); render(); clearTimeout(timerTreino); salvar(() => store.salvarPaciente(p)); }
window.addTreino = () => mudarTreinos(p => { p.treinos.push({ nome: '', exercicios: [novoEx(), novoEx()] }); S.treinoIdx = p.treinos.length - 1; });
window.duplicarTreino = () => mudarTreinos(p => { if (p.treinos.length >= LETRAS.length) return; p.treinos.push(JSON.parse(JSON.stringify(p.treinos[S.treinoIdx]))); S.treinoIdx = p.treinos.length - 1; });
window.excluirTreino = () => mudarTreinos(p => p.treinos.splice(S.treinoIdx, 1));
window.addEx = () => mudarTreinos(p => p.treinos[S.treinoIdx].exercicios.push(novoEx()));
window.removerEx = i => mudarTreinos(p => p.treinos[S.treinoIdx].exercicios.splice(i, 1));

// ---------- Evoluções ----------
const VITAIS = /^(PA|FC|SpO2|Dor|FR|Temp)/i;
function vEvolucoes() {
  const p = pac(S.pac);
  if (!p) return '<div class="head"><h2>Evoluções</h2></div><div class="empty">Cadastre um paciente primeiro.</div>';
  const lista = S.evolucoes.filter(e => e.pacienteId === p.id).sort((a, b) => b.data.localeCompare(a.data));
  return `
  <div class="head"><div><h2>Evoluções</h2><p class="sub">${esc(p.nome)} · ${lista.length} registro${lista.length === 1 ? '' : 's'}</p></div>
  <button onclick="novaEvolucao('${p.id}','${iso(new Date())}')">Nova evolução</button></div>
  ${seletorPaciente()}
  <div class="list">${lista.map(e => {
    const campos = e.campos || [];
    const vit = campos.filter(c => c.valor && VITAIS.test(c.rotulo));
    const resto = campos.filter(c => c.valor && !VITAIS.test(c.rotulo));
    return `<div class="item evo">
      <div class="item-top"><div class="row" style="gap:8px"><strong style="font-variant-numeric:tabular-nums">${br(e.data)}</strong>${e.treino ? `<span class="pill letter">Treino ${esc(e.treino)}</span>` : ''}</div>
        <div class="row" style="gap:2px"><button class="link small" onclick="copiar('${e.id}')">Copiar</button><button class="link small" onclick="abrirEvolucao('${e.id}')">Editar</button></div></div>
      ${vit.length ? `<div class="vitals">${vit.map(c => `<span><b>${esc(c.rotulo.replace(/\s*\(.*\)/, ''))}</b>${esc(c.valor)}</span>`).join('')}</div>` : ''}
      <dl>${resto.map(c => `<div><dt>${esc(c.rotulo)}</dt><dd>${esc(c.valor)}</dd></div>`).join('')}</dl>
    </div>`;
  }).join('') || '<div class="empty">Nenhuma evolução ainda. Use “Evoluir” na agenda ou “Nova evolução”.</div>'}</div>`;
}

function formEvolucao(e, onSave) {
  const p = pac(e.pacienteId);
  sheet(`
    <h3>Evolução · ${esc(p.nome)}</h3>
    <div class="row">
      <label class="field"><span>Data</span><input id="v-data" type="date" name="data" required value="${e.data}"></label>
      <label class="field"><span>Treino</span><select id="v-treino" name="treino"><option value="">Nenhum</option>${(p.treinos || []).map(t => `<option ${t.letra === e.treino ? 'selected' : ''}>${t.letra}</option>`).join('')}</select></label>
    </div>
    <div class="row">${e.campos.map((c, i) => c.tipo === 'linha'
      ? `<label class="field" style="flex:1 1 120px"><span>${esc(c.rotulo)}</span><input id="v${i}" name="c${i}" value="${esc(c.valor)}"></label>` : '').join('')}</div>
    ${e.campos.map((c, i) => c.tipo !== 'linha'
      ? `<label class="field"><span>${esc(c.rotulo)}</span><textarea id="v${i}" name="c${i}">${esc(c.valor)}</textarea></label>` : '').join('')}`,
    f => { e.data = f.get('data'); e.treino = f.get('treino'); e.campos = e.campos.map((c, i) => ({ ...c, valor: f.get('c' + i) || '' })); onSave(e); },
    e.id ? `<button type="button" class="danger" onclick="confirmar('Excluir esta evolução?', () => salvar(() => store.apagarEvolucao('${e.id}'), 'Evolução excluída'))">Excluir</button>` : '');
}
window.novaEvolucao = (pid, data) => {
  const p = pac(pid), t = treinoDoDia(p, data);
  const e = { pacienteId: pid, data, treino: t ? t.letra : '', campos: S.modelo.map(c => ({ ...c, valor: '' })) };
  const conduta = e.campos.find(c => /conduta|exerc/i.test(c.rotulo));
  if (conduta && t) conduta.valor = (t.exercicios || []).filter(x => x.nome).map(x => `${x.nome}${prescricao(x) ? ' — ' + prescricao(x) : ''}`).join('\n');
  formEvolucao(e, ev => salvar(() => store.salvarEvolucao({ ...ev, id: uid() }), 'Evolução salva'));
};
window.abrirEvolucao = id => {
  const e = JSON.parse(JSON.stringify(S.evolucoes.find(x => x.id === id)));
  formEvolucao(e, ev => salvar(() => store.salvarEvolucao(ev), 'Evolução atualizada'));
};
window.copiar = async id => {
  const e = S.evolucoes.find(x => x.id === id);
  const txt = `${pac(e.pacienteId).nome} · ${br(e.data)}${e.treino ? ' · Treino ' + e.treino : ''}\n\n` + e.campos.filter(c => c.valor).map(c => `${c.rotulo}: ${c.valor}`).join('\n');
  try { await navigator.clipboard.writeText(txt); toast('Evolução copiada'); }
  catch (err) { toast('Não deu para copiar neste aparelho'); }
};

// ---------- Modelo ----------
let modeloRascunho = null;
function vModelo() {
  const m = modeloRascunho || S.modelo;
  return `
  <div class="head"><div><h2>Modelo de evolução</h2><p class="sub">Esses campos aparecem em toda evolução nova.</p></div>
  ${modeloRascunho ? '<div class="row"><button class="ghost" onclick="modeloRascunho=null;render()">Descartar</button><button onclick="salvarModelo()">Salvar modelo</button></div>' : ''}</div>
  <div class="list">
    ${m.map((c, i) => `<div class="mf">
      <input id="m${i}" value="${esc(c.rotulo)}" oninput="editarModelo(${i},'rotulo',this.value,false)">
      <select id="mt${i}" onchange="editarModelo(${i},'tipo',this.value)"><option value="linha" ${c.tipo === 'linha' ? 'selected' : ''}>Linha curta</option><option value="texto" ${c.tipo !== 'linha' ? 'selected' : ''}>Texto longo</option></select>
      <button aria-label="Subir" onclick="moverModelo(${i},-1)">↑</button>
      <button aria-label="Descer" onclick="moverModelo(${i},1)">↓</button>
      <button aria-label="Remover" onclick="mexerModelo(l=>l.splice(${i},1))">×</button>
    </div>`).join('')}
    <div><button class="ghost small" onclick="mexerModelo(l=>l.push({rotulo:'Novo campo',tipo:'texto'}))">+ Campo</button></div>
  </div>
  <p class="sub" style="margin-top:24px">${S.nuvem ? 'Seus dados ficam salvos na sua conta e aparecem iguais no celular e no tablet.' : 'Abra pelo link do claude.ai para sincronizar entre aparelhos.'}</p>`;
}
function mexerModelo(fn, rerender = true) { modeloRascunho = modeloRascunho || JSON.parse(JSON.stringify(S.modelo)); fn(modeloRascunho); if (rerender) render(); }
window.mexerModelo = mexerModelo;
window.editarModelo = (i, k, v, re = true) => {
  const tinha = !!modeloRascunho;
  mexerModelo(l => l[i][k] = v, re || !tinha);
  if (!tinha) { const el = $('#m' + i); if (el) { el.focus(); el.setSelectionRange(v.length, v.length); } }
};
window.moverModelo = (i, d) => mexerModelo(l => { const j = i + d; if (j >= 0 && j < l.length) [l[i], l[j]] = [l[j], l[i]]; });
window.salvarModelo = () => { const m = modeloRascunho; modeloRascunho = null; S.modelo = m; render(); salvar(() => store.salvarModelo(m), 'Modelo salvo'); };

render();
iniciarDados();
</script>
